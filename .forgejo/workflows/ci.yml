name: ci

on:
  push:
    branches:
      - main

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  lint:
    secrets:
      GIT_CRYPT_GPG_PRIVATE_KEY: ${{ secrets.GIT_CRYPT_GPG_PRIVATE_KEY }}
    uses: ./.forgejo/workflows/lint.yml
  deploy:
    needs: lint
    secrets: inherit
    uses: ./.forgejo/workflows/deploy.yml
